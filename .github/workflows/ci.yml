name: Smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        run: |
          curl --fail --location --retry 3 --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Import project
        run: godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import
      - name: Run smoke test
        run: godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/smoke.gd
